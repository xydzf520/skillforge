[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = skills-repo web/node_modules playbook-editor/node_modules venv .venv .git .pytest_cache
filterwarnings =
    ignore:\[SkillForge配置警告\] 非DEBUG模式下COOKIE_SECURE不应为False:UserWarning
    ignore:prometheus-fastapi-instrumentator 未安装，跳过指标收集:UserWarning
    ignore:cannot collect test class 'TestCase' because it has a __init__ constructor:pytest.PytestCollectionWarning
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning
    ignore:coroutine 'Connection\._cancel' was never awaited:RuntimeWarning
