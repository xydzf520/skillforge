name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zero-mode-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_no_first_party_js.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: password
          POSTGRES_DB: skillforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://skillforge:password@localhost:5432/skillforge_test
      DATABASE_URL_SYNC: postgresql+psycopg2://skillforge:password@localhost:5432/skillforge_test
      SECRET_KEY: test-secret
      DEBUG: true
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    needs: zero-mode-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --global npm@11.13.0
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npx vitest run --maxWorkers=4

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --global npm@11.13.0
      - run: npm ci --prefix playbook-editor
      - run: npm run build --prefix playbook-editor
      - run: cd web && npm ci
      - run: cd web && npm run build

  build-playbook-editor:
    runs-on: ubuntu-latest
    needs: zero-mode-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --global npm@11.13.0
      - run: cd playbook-editor && npm ci
      - run: cd playbook-editor && npm run typecheck
      - run: cd playbook-editor && npm run build

  build-chrome-extension:
    runs-on: ubuntu-latest
    needs: zero-mode-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --global npm@11.13.0
      - run: cd chrome-extension && npm ci
      - run: cd chrome-extension && npm run typecheck
      - run: cd chrome-extension && npm run build

  check-browser-deploy:
    runs-on: ubuntu-latest
    needs: zero-mode-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: npm install --global npm@11.13.0
      - run: cd deploy/browser && npm ci
      - run: cd deploy/browser && npm run typecheck
