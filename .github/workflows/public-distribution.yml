name: Public distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_distribution.py --staged
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan source and history without exposing values
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner
