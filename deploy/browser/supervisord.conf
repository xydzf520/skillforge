[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# xvfb 由 entrypoint.sh 启动（确保在 Chrome 前就绪）

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -rfbport 5900 -shared
autorestart=true
priority=20

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30

[program:chrome]
command=google-chrome-stable --no-first-run --no-default-browser-check --no-sandbox --disable-blink-features=AutomationControlled --disable-infobars --disable-dev-shm-usage --disable-popup-blocking --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --user-data-dir=/home/chrome/data --window-size=1280,800 --start-maximized --force-device-scale-factor=1 --lang=zh-CN --disable-features=AutomationControlled --enable-features=NetworkService,NetworkServiceInProcess --disable-background-networking --disable-client-side-phishing-detection
autorestart=true
priority=40
environment=DISPLAY=":99",HOME="/home/chrome"
user=chrome

[program:cdp-proxy]
command=socat TCP-LISTEN:9223,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9222
autorestart=true
priority=50
