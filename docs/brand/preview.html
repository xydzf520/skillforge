<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillForge 品牌预览</title>
  <link rel="icon" href="../../web/public/brand/mark.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#203e36;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1200px;padding:48px 32px;margin:auto}header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:28px}h1{font-size:28px;letter-spacing:-1px;margin:4px 0}p{margin:0;color:#64786e}.eyebrow{font-size:11px;letter-spacing:2px;color:#5f7d6e}.status{border:1px solid #cbd9d0;padding:6px 12px;border-radius:99px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #dfe8e1;border-radius:20px;padding:32px;min-width:0}.lockup{display:flex;align-items:center;justify-content:center;gap:20px;height:164px}.lockup img{width:88px;height:88px}.wordmark{font-size:42px;font-weight:650;letter-spacing:-2px}.dark{background:#112e29;color:#f4fbf8}.dark p{color:#abc3b5}.label{font-size:12px;letter-spacing:.4px}.sizes{height:120px;display:flex;align-items:center;gap:32px}.size{display:grid;justify-items:center;gap:12px;color:#70857a;font-size:11px}.swatches{display:flex;gap:12px;padding:26px 0 12px}.swatch{flex:1}.chip{height:48px;border-radius:10px;border:1px solid #dce6df}.swatch code{display:block;font-size:12px;margin-top:8px}.banner{width:100%;display:block;border-radius:14px;margin-top:24px;border:1px solid #dce6df}.note{margin-top:24px;font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;margin-top:24px;border-top:1px solid #e4ece6;padding-top:24px}.toolbar img{width:28px;height:28px}.toolbar strong{font-size:15px;letter-spacing:-.5px}.nav{margin-left:auto;font-size:12px;color:#667f71}a{color:#236d54}@media(max-width:740px){main{padding:26px 18px}.grid{grid-template-columns:1fr}.wordmark{font-size:34px}.lockup img{width:70px;height:70px}header{flex-direction:column}.card{padding:24px}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">SKILLFORGE · VISUAL IDENTITY</div><h1>让业务经验成为可复用的 AI 能力</h1><p>统一标识、应用图标与项目展示</p></div><span class="status">本地预览 · 暂未发布</span></header>
  <div class="grid">
    <section class="card"><p class="label">浅色界面</p><div class="lockup"><img src="../../web/public/brand/mark.svg" alt="模块化 SK 标识"><span class="wordmark">SkillForge</span></div><div class="toolbar"><img src="../../web/public/brand/mark.svg" alt=""><strong>SkillForge</strong><span class="nav">企业 AI 工作台</span></div></section>
    <section class="card dark"><p class="label">深色界面</p><div class="lockup"><img src="../../web/public/brand/mark.svg" alt="模块化 SK 标识"><span class="wordmark">SkillForge</span></div><p>业务方法 → 可复用技能 → 可验证的交付</p></section>
    <section class="card"><p class="label">图标缩放 · 浏览器与系统托盘</p><div class="sizes"><span class="size"><img src="../../chrome-extension/icon16.png" width="16" height="16" alt="16 像素图标">16px</span><span class="size"><img src="../../web/public/favicon-32.png" width="32" height="32" alt="32 像素图标">32px</span><span class="size"><img src="../../bridge/icon_64.png" width="64" height="64" alt="64 像素图标">64px</span><span class="size"><img src="../../bridge/icon_128.png" width="80" height="80" alt="80 像素预览">80px</span></div></section>
    <section class="card"><p class="label">品牌配色</p><div class="swatches"><div class="swatch"><div class="chip" style="background:#123d37"></div><code>#123D37</code></div><div class="swatch"><div class="chip" style="background:#77e3bc"></div><code>#77E3BC</code></div><div class="swatch"><div class="chip" style="background:#f4fbf8"></div><code>#F4FBF8</code></div></div><p>深松绿 / 薄荷绿 / 反白</p></section>
  </div>
  <img class="banner" src="readme-zh.svg" alt="SkillForge 中文 README 横幅">
  <p class="note">连续的几何模块组成 SK，表达连接、复用与积累。<a href="README.md">查看资源与使用说明</a></p>
</main></body></html>
