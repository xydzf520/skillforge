metadata:
  owner: 祁莹莹
  surface: material_workbench
  media_model_family: minimax-h3
  default_preset: vertical_5s
  prompt_policy:
    version: material-fde-h3-v1
    legacy_exact_policy_version: material-exact-h3-v1
    legacy_task_policy_version: minimax-h3-context-ir-v60
    compiler: visible_exact_assembly
    new_tasks_use_legacy_semantic_compiler: false
    provider_api_required: false
    sources:
      - https://github.com/MiniMax-AI/cli/blob/main/skill/h3-video/references/h3-video.md
      - https://platform.minimax.io/docs/guides/video-generation
      - https://platform.minimax.io/docs/api-reference/video-generation-v2-h3-context-ir
      - https://github.com/MiniMax-AI/skills/tree/main/skills/frontend-dev
  production_policy:
    version: material-production-policy-v6
    decisions: [content_intent, quality_aware_routing, review_repair]
  ad_material_policy:
    version: frontdesk-ad-material-v21
    dialogue_delivery_version: material-dialogue-delivery-v8
    source: 前台短视频工作表
  ai_gateway:
    model_profile: deepseek-v4-flash
    optimization_optional: true
    default_planning_mode: operator_brief
    source_understanding_profile: vision
    source_understanding_policy: material-source-understanding-v3
  agents:
    model_profile: deepseek-v4-flash
    scope: user_project
    items: [video_prompt_h3, video_replay_h3]
  workload:
    role: video_generation
    department_priority: 200
  learning_loop:
    enabled: true
    managed_training: true
    candidate_source: media_workbench_learning_loop
    minimum_training_samples: 300
    evaluation_holdout_percent: 20
    rollout_percentages: [10, 25, 50, 100]
